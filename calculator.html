<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保險需要計算器 | Lily Lau @pru_lilylau</title>
<meta name="description" content="免費保險需要計算器，即時估算危疾、醫療及儲蓄保障缺口，附保誠產品建議。">
<link rel="icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    background: #F5EDE0;
    color: #3D2B1A;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg, #F5EDE0 0%, #EDD9C0 100%);
    padding: 1.5rem 1.5rem 1.25rem;
    text-align: center;
    border-bottom: 0.5px solid #F0EAE0;
  }
  .header-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    object-fit: cover; object-position: center top;
    display: block;
    margin: 0 auto 0.6rem;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-name { font-size: 18px; font-weight: 600; color: #3D2B1A; margin-bottom: 3px; }
  .header-sub { font-size: 14px; color: #6B4E35; }
  .header-badges { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 0.6rem; }
  .hbadge { font-size: 12px; padding: 3px 11px; border-radius: 20px; font-weight: 500; }
  .hb-cpa { background: #FAEEDA; color: #633806; }
  .hb-ins { background: #D6E8D5; color: #2A5A2E; }

  /* ── Two-column layout ── */
  .page-body {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 2rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    align-items: start;
  }
  .col-left { display: flex; flex-direction: column; gap: 1rem; }
  .col-right { display: flex; flex-direction: column; gap: 1rem; position: sticky; top: 1.25rem; }

  /* ── Cards ── */
  .card {
    background: #fff;
    border: 0.5px solid #F0EAE0;
    border-radius: 14px;
    padding: 1.25rem;
  }

  .section-title {
    font-size: 15px; font-weight: 700; color: #3D2B1A;
    letter-spacing: .01em;
    margin-bottom: 1.1rem;
  }

  /* ── Form rows ── */
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .row:last-child { margin-bottom: 0; }
  .row.row-wrap { flex-wrap: wrap; }
  .med-hint { flex: 1 0 100%; font-size: 12px; color: #B8A090; margin-top: 4px; padding-left: 2px; }
  .row label { font-size: 15px; color: #6B4E35; width: 110px; flex-shrink: 0; }
  .row input[type=range] {
    flex: 1; min-width: 0; height: 4px; border-radius: 2px;
    -webkit-appearance: none; appearance: none;
    background: #F0EAE0; outline: none; cursor: pointer;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: #C9956B; cursor: pointer;
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .row .val { font-size: 15px; font-weight: 500; color: #3D2B1A; min-width: 85px; text-align: right; }
  .row .val-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .row .val-input {
    font-size: 15px; font-weight: 500; color: #3D2B1A;
    width: 92px; text-align: right;
    border: 1px solid #F0EAE0; border-radius: 8px;
    padding: 4px 8px; font-family: inherit;
    background: #FFFCF8; outline: none;
    -moz-appearance: textfield;
  }
  .row .val-input:focus { border-color: #C9956B; }
  .row .val-input::-webkit-outer-spin-button,
  .row .val-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row .val-unit { font-size: 13px; color: #6B4E35; flex-shrink: 0; }
  .text-input {
    flex: 1; border: 1px solid #F0EAE0; border-radius: 8px;
    padding: 6px 10px; font-size: 14px; font-family: inherit;
    color: #3D2B1A; background: #FFFCF8; outline: none;
  }

  .seg { display: flex; gap: 5px; flex: 1; min-width: 0; flex-wrap: wrap; }
  .seg.multi button { border-radius: 8px; }
  .seg button {
    font-size: 13px; padding: 5px 12px; border-radius: 20px;
    border: 0.5px solid #D8C9BA;
    background: #FFFCF8; color: #6B4E35; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .seg button.active { background: #C9956B; border-color: #C9956B; color: #fff; }

  /* ── Results metrics ── */
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
  .metric { background: #FBF8F4; border-radius: 10px; padding: 0.8rem 1rem; }
  .metric-label { font-size: 12px; color: #A08060; margin-bottom: 4px; }
  .metric-val { font-size: 20px; font-weight: 600; color: #3D2B1A; }
  .metric-val-status { font-size: 16px; }
  .metric-sub { font-size: 11px; color: #B8A090; margin-top: 2px; }

  /* ── Gap bars ── */
  .gap-row { margin-bottom: 11px; }
  .gap-row:last-child { margin-bottom: 0; }
  .gap-bar-label { display: flex; justify-content: space-between; font-size: 13px; color: #6B4E35; margin-bottom: 5px; }
  .gap-bar-track { height: 8px; background: #F0E8DF; border-radius: 4px; overflow: hidden; }
  .gap-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }

  /* ── Product recommendations (right col) ── */
  .rec-title {
    font-size: 15px; font-weight: 600; color: #3D2B1A;
    margin-bottom: 0.9rem;
    display: flex; align-items: center; gap: 7px;
  }
  .rec-title svg { width: 18px; height: 18px; flex-shrink: 0; }

  .prod-card {
    background: #FFFCF8; border: 0.5px solid #F0EAE0;
    border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 0.7rem;
  }
  .prod-card:last-child { margin-bottom: 0; }
  .prod-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .prod-name-zh { font-size: 15px; font-weight: 500; color: #3D2B1A; line-height: 1.4; }
  .prod-name-en { font-size: 11px; color: #B8A090; margin-top: 2px; font-style: italic; }
  .prod-cat { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .cat-ci { background: #FCEBEB; color: #A32D2D; }
  .cat-med { background: #E6F1FB; color: #0C447C; }
  .cat-life { background: #EAF3DE; color: #27500A; }
  .cat-save { background: #FAEEDA; color: #633806; }
  .prod-desc { font-size: 13px; color: #6B4E35; line-height: 1.6; margin-bottom: 8px; }
  .prod-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .prod-tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #F0E8DF; color: #6B4E35; }
  .prod-why { font-size: 13px; color: #633806; background: #FBF8F4; border-radius: 6px; padding: 8px 10px; border: 0.5px solid #F0EAE0; line-height: 1.55; }

  .no-gap { font-size: 15px; color: #6B4E35; padding: 1rem; background: #FBF8F4; border-radius: 10px; text-align: center; }

  /* ── Child section ── */
  .child-block { margin-top: 1rem; padding-top: 1rem; border-top: 0.5px solid #F0E8DF; }
  .child-block-title { font-size: 13px; font-weight: 600; color: #C9956B; margin-bottom: 0.7rem; }
  .child-gap-section, .spouse-gap-section { margin-top: 1rem; }
  .child-gap-title, .spouse-gap-title { font-size: 13px; font-weight: 600; color: #6B4E35; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }

  /* ── CTA ── */
  .cta-card {
    background: linear-gradient(160deg, #F5EDE0 0%, #EDD9C0 100%);
    border: 0.5px solid #F0EAE0; border-radius: 14px;
    padding: 1.1rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .cta-text strong { display: block; font-size: 16px; font-weight: 500; color: #3D2B1A; margin-bottom: 3px; }
  .cta-text p { font-size: 14px; color: #6B4E35; line-height: 1.5; }
  .cta-btn {
    background: #C9956B; color: #fff; border: none;
    font-size: 15px; font-weight: 500; padding: 10px 20px;
    border-radius: 22px; cursor: pointer; white-space: nowrap;
    font-family: inherit; text-decoration: none; display: inline-block;
    transition: background .15s;
  }
  .cta-btn:hover { background: #B8845A; }

  .footer { text-align: center; font-size: 12px; color: #B8A090; padding: 0 1rem 2rem; line-height: 1.7; }

  /* ── WhatsApp Summary Button ── */
  .wa-summary-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    width: 100%;
    margin-top: 1.2rem;
    padding: 0.85rem 1rem;
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.01em;
    font-family: inherit;
    transition: background 0.18s, transform 0.12s;
  }
  .wa-summary-btn:hover { background: #1ebe5d; transform: translateY(-1px); }
  .wa-summary-btn:active { background: #17a850; transform: translateY(0); }

  /* ── Fixed WhatsApp FAB ── */
  @keyframes wa-float {
    0%,100% { transform: translateY(0); box-shadow: 0 4px 16px rgba(37,211,102,0.4); }
    50%      { transform: translateY(-7px); box-shadow: 0 12px 28px rgba(37,211,102,0.32); }
  }
  .wa-fab {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px; height: 52px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 50%;
    animation: wa-float 2.8s ease-in-out infinite;
  }
  .wa-fab:hover {
    background: #1ebc5a;
    animation-play-state: paused;
  }
  .wa-fab svg {
    width: 26px; height: 26px;
  }

  /* ── Mobile: single column ── */
  @media (max-width: 720px) {
    .page-body { grid-template-columns: 1fr; }
    .col-right { position: static; }

    body { font-size: 17px; }
    .header-name { font-size: 19px; }
    .header-sub { font-size: 15px; }
    .hbadge { font-size: 13px; }
    .section-title { font-size: 16px; }
    .row { flex-wrap: wrap; row-gap: 8px; }
    .row label { width: 100%; font-size: 16px; }
    .row input[type=range] { flex: 1 1 140px; }
    .row .val { font-size: 16px; min-width: 75px; }
    .row .val-input { font-size: 16px; width: 84px; }
    .row .val-unit { font-size: 14px; }
    .text-input { font-size: 15px; }
    .med-hint { font-size: 13px; }
    .seg button { font-size: 14px; }
    .metric-label { font-size: 13px; }
    .metric-val { font-size: 21px; }
    .metric-val-status { font-size: 17px; }
    .metric-sub { font-size: 13px; }
    .gap-bar-label { font-size: 14px; }
    .rec-title { font-size: 16px; }
    .prod-name-zh { font-size: 16px; }
    .prod-name-en { font-size: 13px; }
    .prod-cat { font-size: 12px; }
    .prod-desc { font-size: 14px; }
    .prod-tag { font-size: 12px; }
    .prod-why { font-size: 14px; }
    .no-gap { font-size: 16px; }
    .child-block-title { font-size: 14px; }
    .child-gap-title, .spouse-gap-title { font-size: 14px; }
    .cta-text strong { font-size: 17px; }
    .cta-text p { font-size: 15px; }
    .cta-btn { font-size: 16px; }
    .wa-summary-btn { font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <img class="header-avatar" src="assets/avatar.jpg" alt="Lily Lau">
  <div class="header-name">Lily Lau</div>
  <div class="header-sub">@pru_lilylau</div>
  <div class="header-badges">
    <span class="hbadge hb-cpa">持牌會計師 CPA</span>
    <span class="hbadge hb-ins">持牌保險顧問</span>
  </div>
</div>

<div class="page-body">

  <!-- 左欄：輸入 + 結果 -->
  <div class="col-left">

  <div class="card">
    <div class="section-title">基本資料</div>
    <div class="row">
      <label>稱呼</label>
      <input type="text" id="client-name" class="text-input" placeholder="例如：Chris Wong">
    </div>
    <div class="row">
      <label>WhatsApp電話</label>
      <input type="tel" id="client-phone" class="text-input" inputmode="numeric" placeholder="例如：61234567">
    </div>
    <div class="row">
      <label>性別</label>
      <div class="seg" id="gender-seg">
        <button data-v="male" onclick="setSeg('gender',this)" class="active">男 ♂</button>
        <button data-v="female" onclick="setSeg('gender',this)">女 ♀</button>
      </div>
    </div>
    <div class="row">
      <label>年齡</label>
      <input type="range" id="age" min="22" max="60" value="35" step="1">
      <div class="val-wrap"><input type="number" class="val-input" id="age-num" min="22" max="60" step="1" value="35"><span class="val-unit">歲</span></div>
    </div>
    <div class="row">
      <label>月入（港元）</label>
      <input type="range" id="income" min="10000" max="300000" value="30000" step="1000">
      <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="income-num" value="30000"></div>
    </div>
    <div class="row">
      <label>家庭負擔</label>
      <div class="seg" id="dep-seg">
        <button data-v="0" onclick="setSeg('dep',this)">0人</button>
        <button data-v="1" onclick="setSeg('dep',this)" class="active">1人</button>
        <button data-v="2" onclick="setSeg('dep',this)">2人</button>
        <button data-v="3" onclick="setSeg('dep',this)">3人+</button>
      </div>
    </div>
    <div class="row">
      <label>現有儲蓄</label>
      <input type="range" id="savings" min="0" max="10000000" value="100000" step="50000">
      <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="savings-num" value="100000"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">現有保障</div>
    <div class="row">
      <label>危疾保額</label>
      <input type="range" id="ci-have" min="0" max="10000000" value="0" step="50000">
      <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="ci-have-num" value="0"></div>
    </div>
    <div class="row row-wrap">
      <label>醫療計劃</label>
      <div class="seg multi" id="med-seg">
        <button data-v="company" onclick="toggleMed('company',this)">公司</button>
        <button data-v="basic" onclick="toggleMed('basic',this)">基本</button>
        <button data-v="high" onclick="toggleMed('high',this)">高端</button>
      </div>
      <div class="med-hint">可多選，未有保障就唔選</div>
    </div>
    <div class="row">
      <label>人壽保額</label>
      <input type="range" id="life-have" min="0" max="20000000" value="0" step="100000">
      <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="life-have-num" value="0"></div>
    </div>
  </div>

  <div class="card" id="spouse-card">
    <div class="section-title">配偶資料</div>
    <div class="row">
      <label>婚姻狀況</label>
      <div class="seg" id="marital-seg">
        <button data-v="single" onclick="setSeg('marital',this)" class="active">未婚</button>
        <button data-v="married" onclick="setSeg('marital',this)">已婚</button>
      </div>
    </div>
    <div id="spouse-details" style="display:none">
      <div class="row" style="margin-top:0.8rem">
        <label>配偶年齡</label>
        <input type="range" id="sp-age" min="22" max="70" value="35" step="1">
        <div class="val-wrap"><input type="number" class="val-input" id="sp-age-num" min="22" max="70" step="1" value="35"><span class="val-unit">歲</span></div>
      </div>
      <div class="row">
        <label>配偶月入</label>
        <input type="range" id="sp-income" min="0" max="300000" value="0" step="1000">
        <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="sp-income-num" value="0"></div>
      </div>
      <div class="row">
        <label>配偶危疾保額</label>
        <input type="range" id="sp-ci-have" min="0" max="10000000" value="0" step="50000">
        <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="sp-ci-have-num" value="0"></div>
      </div>
      <div class="row">
        <label>配偶人壽保額</label>
        <input type="range" id="sp-life-have" min="0" max="20000000" value="0" step="100000">
        <div class="val-wrap"><span class="val-unit">$</span><input type="text" inputmode="numeric" class="val-input" id="sp-life-have-num" value="0"></div>
      </div>
      <div class="row row-wrap">
        <label>配偶醫療計劃</label>
        <div class="seg multi" id="sp-med-seg">
          <button data-v="company" onclick="toggleSpouseMed('company',this)">公司</button>
          <button data-v="basic" onclick="toggleSpouseMed('basic',this)">基本</button>
          <button data-v="high" onclick="toggleSpouseMed('high',this)">高端</button>
        </div>
        <div class="med-hint">可多選，未有保障就唔選</div>
      </div>
    </div>
  </div>

  <div class="card" id="child-card">
    <div class="section-title">子女資料</div>
    <div class="row">
      <label>有冇小朋友</label>
      <div class="seg" id="hasChild-seg">
        <button data-v="no" onclick="setSeg('hasChild',this)" class="active">冇</button>
        <button data-v="yes" onclick="setSeg('hasChild',this)">有</button>
      </div>
    </div>
    <div id="child-details" style="display:none">
      <div class="row" style="margin-top:0.8rem">
        <label>小朋友數目</label>
        <div class="seg" id="childCount-seg">
          <button data-v="1" onclick="setSeg('childCount',this)" class="active">1</button>
          <button data-v="2" onclick="setSeg('childCount',this)">2</button>
          <button data-v="3" onclick="setSeg('childCount',this)">3</button>
          <button data-v="4" onclick="setSeg('childCount',this)">4</button>
          <button data-v="5" onclick="setSeg('childCount',this)">5</button>
        </div>
      </div>
      <div id="child-inputs"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">估算結果</div>
    <div class="results-grid" id="results"></div>
    <div id="gaps"></div>
    <div id="spouse-gaps"></div>
    <div id="child-gaps"></div>

function parseNum(str) { return parseInt(String(str).replace(/[^0-9-]/g, ''), 10) || 0; }
function formatNum(n, money) { return money ? n.toLocaleString('en-US') : String(n); }
function numVal(id) { return parseNum(document.getElementById(id).value); }

function bindSlider(rangeId, numId, onChange, money) {
  const range = document.getElementById(rangeId);
  const num = document.getElementById(numId);
  const min = +range.min, max = +range.max;

  num.value = formatNum(parseNum(num.value), money);

  range.addEventListener('input', () => {
    num.value = formatNum(+range.value, money);
    onChange(+range.value);
  });
  num.addEventListener('input', () => {
    if (money) {
      const digits = num.value.replace(/[^0-9]/g, '');
      if (digits !== num.value) num.value = digits;
    }
    if (num.value === '') return;
    const v = parseNum(num.value);
    if (!isNaN(v) && v >= min && v <= max) range.value = v;
    onChange(isNaN(v) ? 0 : v);
  });
  num.addEventListener('blur', () => {
    let v = num.value === '' ? NaN : parseNum(num.value);
    if (num.value === '' || isNaN(v)) v = min;
    v = Math.min(max, Math.max(min, v));
    num.value = formatNum(v, money);
    range.value = v;
    onChange(v);
  });
}

  document.getElementById('results').innerHTML = `
    <div class="metric"><div class="metric-label">危疾建議保額</div><div class="metric-val">${fmt(ciNeed)}</div><div class="metric-sub">年入 × 5 倍</div></div>
    <div class="metric"><div class="metric-label">人壽建議保額</div><div class="metric-val">${dep>0?fmt(lifeNeed):'—'}</div><div class="metric-sub">${dep>0?'有家庭負擔':'暫無需要'}</div></div>
    <div class="metric"><div class="metric-label">醫療保障</div><div class="metric-val metric-val-status" style="color:${gapBarColor(medScore)}">${getMedStatusLabel(medScore)}</div><div class="metric-sub">現有：${getMedSubLabel()}（評分 ${medScore}%）</div></div>
    <div class="metric"><div class="metric-label">退休儲蓄目標</div><div class="metric-val">${fmt(savingsNeed)}</div><div class="metric-sub">${years} 年後退休目標</div></div>
  `;

  document.getElementById('gaps').innerHTML = [
    ['危疾保障', ciPct, ciGap > 0 ? '缺口 '+fmt(ciGap) : '足夠'],
    ['人壽保障', lifePct, dep===0?'(無需要)':'缺口 '+fmt(lifeGap)],
    ['醫療保障', medScore, getMedStatusLabel(medScore)],
    ['退休儲蓄', savPct, '缺口 '+fmt(savingsGap)]
  ].map(([l,p,s])=>`
    <div class="gap-row">
      <div class="gap-bar-label"><span>${l}</span><span>${p}% · ${s}</span></div>
      <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${p}%;background:${gapBarColor(p)}"></div></div>
    </div>`).join('');

  // Child gaps
  let childGapsHtml = '';
  if (state.hasChild === 'yes' && state.children.length > 0) {
    childGapsHtml = '<div class="child-gap-section">';
    state.children.forEach((c, i) => {
      const ciChildGap = Math.max(0, CI_CHILD_NEED - c.ci);
      const ciChildPct = Math.min(100, Math.round(c.ci / CI_CHILD_NEED * 100));
      const cms = c.medSet || new Set();
      const medChildScore = medScoreFromSet(cms);
      const yearsToUni = Math.max(0, 18 - c.age);
      const eduNeed = EDU_COST_PER_YEAR * 4;
      const eduHave = c.edu || 0;
      const eduGap = Math.max(0, eduNeed - eduHave);
      const eduPct = Math.min(100, Math.round(eduHave / Math.max(eduNeed,1) * 100));
      const childLabel = `👶 子女 ${i+1}（${c.age} 歲）`;
      childGapsHtml += `<div class="child-gap-title">${childLabel}</div>`;
      childGapsHtml += [
        ['危疾保障', ciChildPct, ciChildGap > 0 ? '缺口 '+fmt(ciChildGap) : '足夠'],
        ['醫療保障', medChildScore, getMedStatusLabel(medChildScore)],
        ['教育儲備', eduPct, (eduGap > 0 ? '缺口 '+fmt(eduGap) : '已足夠')+'（'+yearsToUni+'年後需用）'],
      ].map(([l,p,s])=>`
        <div class="gap-row">
          <div class="gap-bar-label"><span>${l}</span><span>${p}% · ${s}</span></div>
          <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${p}%;background:${gapBarColor(p)}"></div></div>
        </div>`).join('');
    });
    childGapsHtml += '</div>';
  }
  document.getElementById('child-gaps').innerHTML = childGapsHtml;

  // Spouse gaps
  let spouse = null;
  if (state.marital === 'married') {
    const spAge = numVal('sp-age-num');
    const spIncome = numVal('sp-income-num');
    const spCiHave = numVal('sp-ci-have-num');
    const spLifeHave = numVal('sp-life-have-num');
    const spAnnualIncome = spIncome * 12;
    const spCiNeed = spAnnualIncome * 5;
    const spCiGap = Math.max(0, spCiNeed - spCiHave);
    const spCiPct = Math.min(100, Math.round(spCiHave / Math.max(spCiNeed,1) * 100));
    const spLifeNeed = dep > 0 ? spAnnualIncome * (dep + 2) : 0;
    const spLifeGap = Math.max(0, spLifeNeed - spLifeHave);
    const spLifePct = dep > 0 ? Math.min(100, Math.round(spLifeHave / Math.max(spLifeNeed,1) * 100)) : 100;
    const spMedScore = medScoreFromSet(state.spouseMedSet);
    spouse = {age:spAge, income:spIncome, ciGap:spCiGap, ciPct:spCiPct, lifeGap:spLifeGap, lifePct:spLifePct, medScore:spMedScore};

    document.getElementById('spouse-gaps').innerHTML = `
      <div class="spouse-gap-section">
        <div class="spouse-gap-title">💍 配偶（${spAge} 歲）</div>
        ${[
          ['危疾保障', spCiPct, spCiGap > 0 ? '缺口 '+fmt(spCiGap) : '足夠'],
          ['人壽保障', spLifePct, dep===0 ? '(無需要)' : (spLifeGap > 0 ? '缺口 '+fmt(spLifeGap) : '足夠')],
          ['醫療保障', spMedScore, getMedStatusLabel(spMedScore)],
        ].map(([l,p,s])=>`
          <div class="gap-row">
            <div class="gap-bar-label"><span>${l}</span><span>${p}% · ${s}</span></div>
            <div class="gap-bar-track"><div class="gap-bar-fill" style="width:${p}%;background:${gapBarColor(p)}"></div></div>
          </div>`).join('')}
      </div>`;
  } else {
    document.getElementById('spouse-gaps').innerHTML = '';
  }

  const g = {ciPct,ciGap,lifePct,lifeGap,savPct,savingsGap,medScore,dep,income,age,medSet:state.medSet,spouse};
  state.lastCalc = g;
  if (!recsUnlocked) return;

  const matched = PRODUCTS.filter(p => p.trigger(g));

  document.getElementById('recommendations').innerHTML = matched.length === 0
    ? `<div class="no-gap">你的保障規劃已相當完善！建議定期檢視保單。</div>`
    : matched.map(p=>`
      <div class="prod-card">
        <div class="prod-header">
          <div>
            <div class="prod-name-zh">${p.nameZh}</div>
            <div class="prod-name-en">${p.nameEn}</div>
          </div>
          <span class="prod-cat ${p.catClass}">${p.catLabel}</span>
        </div>
        <div class="prod-desc">${p.desc}</div>
        <div class="prod-tags">${p.tags.map(t=>`<span class="prod-tag">${t}</span>`).join('')}</div>
        <div class="prod-why">${p.why(g)}</div>
      </div>`).join('');
}

[
  ['age', false], ['income', true], ['savings', true], ['ci-have', true], ['life-have', true],
  ['sp-age', false], ['sp-income', true], ['sp-ci-have', true], ['sp-life-have', true]
].forEach(([id, money]) => {
  bindSlider(id, id+'-num', calc, money);
});

function sendSummaryToWhatsApp() {
  var clientName = document.getElementById('client-name').value.trim();
  var clientPhone = document.getElementById('client-phone').value.trim();
  if (!clientPhone) {
    clientPhone = prompt('麻煩留低你嘅WhatsApp電話，等Lily可以跟進你嘅保障缺口分析：') || '';
    document.getElementById('client-phone').value = clientPhone;
  }
  var g = state.lastCalc || {};
  var age = g.age;
  var income = g.income;
  var dep = g.dep;
  var gender = state.gender;
  var medLabel = getMedLabel() + (state.medSet.has('company') && state.medSet.size === 1 ? '（離職後失保）' : '');
  var genderLabel = gender === 'male' ? '男' : '女';
  var childMedMap = {company:'公司醫療',basic:'基本',high:'高端'};

  var sections = [];
  sections.push('你好 Lily，以下係我嘅保險需要分析結果：');

  var basicLines = ['【基本資料】'];
  if (clientName) basicLines.push('稱呼：' + clientName);
  basicLines.push('性別：' + genderLabel + '｜年齡：' + age + ' 歲｜月入：' + fmt(income));
  basicLines.push('家庭負擔：' + (dep === 0 ? '暫無' : dep + ' 人'));
  sections.push(basicLines.join('\n'));

  var gapLines = ['【保障缺口】'];
  gapLines.push('• 危疾：' + (g.ciGap > 0 ? '缺口 ' + fmt(g.ciGap) : '足夠') + '（現有保障 ' + g.ciPct + '%）');
  gapLines.push('• 人壽：' + (dep === 0 ? '暫無需要' : '缺口 ' + fmt(g.lifeGap) + '（現有保障 ' + g.lifePct + '%）'));
  gapLines.push('• 醫療：現有 ' + medLabel + ' － ' + getMedStatusLabel(g.medScore));
  gapLines.push('• 退休儲蓄：缺口 ' + fmt(g.savingsGap));
  sections.push(gapLines.join('\n'));

  if (g.spouse) {
    var sp = g.spouse;
    var spMedLabel = state.spouseMedSet.size === 0 ? '未有醫療保障' : Array.from(state.spouseMedSet).map(function(v){ return childMedMap[v]||v; }).join(' + ');
    var spLines = ['【配偶保障】（' + sp.age + ' 歲）'];
    spLines.push('• 危疾：' + (sp.ciGap > 0 ? '缺口 ' + fmt(sp.ciGap) + '（現有保障 ' + sp.ciPct + '%）' : '足夠'));
    spLines.push('• 人壽：' + (dep === 0 ? '暫無需要' : (sp.lifeGap > 0 ? '缺口 ' + fmt(sp.lifeGap) + '（現有保障 ' + sp.lifePct + '%）' : '足夠')));
    spLines.push('• 醫療：現有 ' + spMedLabel + ' － ' + getMedStatusLabel(sp.medScore));
    sections.push(spLines.join('\n'));
  }

  if (state.hasChild === 'yes' && state.children && state.children.length > 0) {
    var childLines = ['【子女保障】'];
    state.children.forEach(function(c, i) {
      var cms = c.medSet || new Set();
      var ciChildGap = Math.max(0, CI_CHILD_NEED - c.ci);
      var yearsToUni = Math.max(0, 18 - c.age);
      var medChildLabel = cms.size === 0 ? '未有' : Array.from(cms).map(function(v){ return childMedMap[v]||v; }).join('+');
      var eduGap = Math.max(0, EDU_COST_PER_YEAR*4 - (c.edu || 0));
      childLines.push('👶 子女' + (i+1) + '（' + c.age + ' 歲）');
      childLines.push('• 危疾缺口：' + fmt(ciChildGap));
      childLines.push('• 醫療：' + medChildLabel);
      childLines.push('• 教育儲備：' + (eduGap > 0 ? '缺口 ' + fmt(eduGap) : '已足夠') + '（' + yearsToUni + ' 年後需用）');
    });
    sections.push(childLines.join('\n'));
  }

  sections.push('📌 想了解更多，請問可以聯絡你嗎？');

  var msg = sections.join('\n\n');
  var url = 'https://wa.me/85260133108?text=' + encodeURIComponent(msg);

  submitResultsToFormspree({
    name: clientName,
    phone: clientPhone,
    email: state.clientEmail || '',
    source: 'insurance-gap-calculator-results',
    submittedAt: new Date().toISOString(),
    result_summary: msg
  });

  logToBackend({
    name: clientName,
    phone: clientPhone,
    email: state.clientEmail || '',
    gender: genderLabel,
    age: age,
    income: income,
    dep: dep,
    savings: numVal('savings-num'),
    ciHave: numVal('ci-have-num'),
    lifeHave: numVal('life-have-num'),
    medPlan: medLabel,
    ciGap: g.ciGap,
    ciPct: g.ciPct,
    lifeGap: g.lifeGap,
    lifePct: g.lifePct,
    medStatus: getMedStatusLabel(g.medScore),
    savingsGap: g.savingsGap,
    marital: state.marital,
    spouseAge: g.spouse ? g.spouse.age : '',
    spouseIncome: g.spouse ? numVal('sp-income-num') : '',
    spouseMed: g.spouse ? (state.spouseMedSet.size === 0 ? '未有醫療保障' : Array.from(state.spouseMedSet).map(function(v){ return childMedMap[v]||v; }).join(' + ')) : '',
    spouseCiGap: g.spouse ? g.spouse.ciGap : '',
    spouseLifeGap: g.spouse ? g.spouse.lifeGap : '',
    children: (state.hasChild === 'yes' && state.children) ? state.children.map(function(c, i) {
      var cms = c.medSet || new Set();
      var medChildLabel = cms.size === 0 ? '未有' : Array.from(cms).map(function(v){ return childMedMap[v]||v; }).join('+');
      var eduGap = Math.max(0, EDU_COST_PER_YEAR*4 - (c.edu || 0));
      return '子女' + (i+1) + '(' + c.age + '歲) CI缺口:' + fmt(Math.max(0, CI_CHILD_NEED - c.ci)) + ' 醫療:' + medChildLabel + ' 教育缺口:' + fmt(eduGap);
    }).join(' | ') : ''
  });

  window.open(url, '_blank');
}
